<section
  class="sezione sezione--lavanda"
  aria-labelledby="dove-titolo"
  *transloco="let t; prefix: 'home.contacts'"
>
  <div class="wrap due-colonne">
    <p-card id="dove">
      <h2 id="dove-titolo">{{ t('location') }}</h2>
      <address class="indirizzo">
        <strong>{{ t('parish') }}</strong
        ><br />
        Via Sant’Osvaldo 4<br />
        35127 Padova
      </address>
      <p class="azioni">
        <a
          pButton
          href="https://www.openstreetmap.org/search?query=Via%20Sant%27Osvaldo%204%2C%2035127%20Padova"
        >
          <span class="pi pi-map-marker" aria-hidden="true"></span>
          <span pButtonLabel>{{ t('map') }}</span>
        </a>
      </p>
      <p class="parrocchia">
        <a href="https://cristorepd.it/scout-padova-6/">{{ t('parishPage') }}</a>
      </p>
    </p-card>
    <p-card id="contatti">
      <h2>{{ t('title') }}</h2>
      <p>{{ t('intro') }}</p>
      <p>
        <a class="email" href="mailto:padova6@veneto.agesci.it">padova6&#64;veneto.agesci.it</a>
      </p>
      <p class="instagram">
        {{ t('instagram') }}
        <a href="https://www.instagram.com/agescipadova6/" lang="en"
          ><span class="pi pi-instagram" aria-hidden="true"></span>&#64;agescipadova6</a
        >
      </p>
      <p class="nota">
        {{ t('official') }}
        <a href="mailto:padova6@pec.agesci.it">padova6&#64;pec.agesci.it</a>
      </p>
    </p-card>
  </div>
</section>
